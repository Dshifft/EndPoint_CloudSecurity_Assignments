services:
  voting-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting_app_task_3
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./:/app
      - voting_app_logs:/app/logs
    command: uvicorn main:voting_app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      voting_db:
        condition: service_healthy

  voting_db:
    image: postgres:18.6
    container_name: voting_db_task_3
    env_file:
      - .env
    volumes:
      - voting_app_db_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  voting_app_logs:
  voting_app_db_data:
