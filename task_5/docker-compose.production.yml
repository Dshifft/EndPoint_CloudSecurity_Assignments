services:
  voting-app:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      replicas: 2
    env_file:
      - .env
    volumes:
      - voting_app_logs:/app/logs
    command: uvicorn main:voting_app --host 0.0.0.0 --port 8000
    depends_on:
      voting_db:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.nginx.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.crt:/etc/ssl/certs/nginx.crt:ro
      - ./nginx/nginx.key:/etc/ssl/private/nginx.key:ro
    depends_on:
      - voting-app
      - voting_db

  voting_db:
    image: postgres:18.6
    env_file:
      - .env
    volumes:
      - voting_app_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voting_app_logs:
  voting_app_db_data:
